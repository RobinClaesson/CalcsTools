name: Deploy to GitHub Pages
on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Unit Tests
        run: dotnet test CalcTools.Tests/CalcTools.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal
        
  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install .NET WebAssembly Tools
      run: dotnet workload install wasm-tools
    - name: Restore dependencies
      run: dotnet restore
    - name: Publish CalcTools.Web
      run: dotnet publish CalcTools.Web/CalcTools.Web.csproj --no-restore -c Release -o publish -p:GHPages=true
    - name: Upload all published files
      uses: actions/upload-pages-artifact@v5
      with:
        path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5