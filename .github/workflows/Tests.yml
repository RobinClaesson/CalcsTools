name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call: 
    
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Unit Tests
      run: dotnet test CalcTools.Tests/CalcTools.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal --results-directory ./TestResults --report-trx --report-trx-filename test-results.trx
    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: ${{ always() }}
      with:
        name: unit-test-results-${{ github.run_number }}
        path: ./TestResults/*.trx
        if-no-files-found: warn
        retention-days: 14
